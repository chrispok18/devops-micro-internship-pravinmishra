apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: book-review
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      # Home page calls /api/api/books -> backend /api/books
      location /api/api/ {
        proxy_pass http://backend-service:3010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Other pages call /api/books, /api/users, /api/reviews
      location /api/ {
        proxy_pass http://backend-service:3010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Everything else -> Next.js server in the same Pod
      location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
